      repo: https://gitlab.com/code-hive/hivesyncapi.git
    id: AddDataLayer
    path: ../src/HiveSync.Data/ServiceCollectionExtensions.cs
    startLine: 26
  assemblies:
  - HiveSync.Data
  namespace: HiveSync.Data
  summary: Adds the HiveSync data layer to the specified <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This method configures:

    - Entity Framework Core with Npgsql and NodaTime support.

    - ASP.NET Core Identity for <xref href="HiveSync.Application.Contracts.Entities.Identity.AppUser" data-throw-if-not-resolved="false"></xref> with confirmed account requirement.

    - Scans and registers all repository classes in the "HiveSync.Data.Repositories" namespace
      with their implemented interfaces and scoped lifetime.
  example: []
  syntax:
    content: public static IServiceCollection AddDataLayer(this IServiceCollection services, string connectionString)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add services to.
    - id: connectionString
      type: System.String
      description: The PostgreSQL connection string for <xref href="HiveSync.Data.AppDbContext" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The updated <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> instance.
    content.vb: Public Shared Function AddDataLayer(services As IServiceCollection, connectionString As String) As IServiceCollection

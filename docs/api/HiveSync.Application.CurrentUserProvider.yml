  assemblies:
  - HiveSync.Application
  namespace: HiveSync.Application
  summary: >-
    Provides access to information about the currently authenticated user

    based on claims stored in the HTTP context.


    This implementation relies on JWT claims and assumes that:

    - <xref href="System.Security.Claims.ClaimTypes.NameIdentifier" data-throw-if-not-resolved="false"></xref> contains the user ID (GUID)

    - A custom claim "inbox_id" contains the default Inbox project ID (GUID)

    - <xref href="System.Security.Claims.ClaimTypes.Email" data-throw-if-not-resolved="false"></xref> contains the user's email


    Throws <xref href="System.UnauthorizedAccessException" data-throw-if-not-resolved="false"></xref> if required claims

    are missing or the user is not authenticated.
  example: []
  syntax:

  assemblies:
  - HiveSync.Utilities
  namespace: HiveSync.Utilities.Error
  summary: Adds a validation error message for the specified field.
  remarks: >-
    If an error entry for the specified field already exists,

    the message is appended to its message collection.

    Otherwise, a new error entry is created.
  example: []
  syntax:
    content: public ValidationErrorBuilder Add(string field, string message)
    parameters:
    - id: field
      type: System.String
      description: The name of the field associated with the validation error.
    - id: message
      type: System.String
      description: The validation error message to associate with the field.
    return:
      type: HiveSync.Utilities.Error.ValidationErrorBuilder
      description: The current <xref href="HiveSync.Utilities.Error.ValidationErrorBuilder" data-throw-if-not-resolved="false"></xref> instance to allow method chaining.

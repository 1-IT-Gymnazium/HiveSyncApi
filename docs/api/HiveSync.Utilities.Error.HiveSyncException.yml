  summary: >-
    Base class for all application-specific exceptions in HiveSync,

    providing structured error information for API responses.
  remarks: >-
    Inherits from <xref href="System.Exception" data-throw-if-not-resolved="false"></xref> and includes an HTTP status code

    and a collection of <xref href="HiveSync.Utilities.Error.ApiErrorItem" data-throw-if-not-resolved="false"></xref> instances representing

    detailed error messages. Derived exceptions typically correspond to

    specific HTTP status codes like 401, 404, or 409.
